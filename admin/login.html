    <h1 class="text-xl font-extrabold text-center mb-1">Painel Administrativo</h1>
    <p class="text-sm text-center mb-7" style="color:var(--slate-600);">Acesso restrito à equipe Branding Soluções</p>

    <form id="loginForm" novalidate class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1.5" for="email">E-mail</label>
        <input class="field-input field-input-lg" type="email" id="email" name="email" placeholder="voce@brandingsolucoes.com.br" required autocomplete="username">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5" for="password">Senha</label>
        <input class="field-input field-input-lg" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div id="loginError" class="hidden text-sm font-medium px-3 py-2.5 rounded-xl" style="background:#FDECEC; color:var(--danger);"></div>

      <button type="submit" id="loginBtn" class="btn-gold w-full mt-2">Entrar</button>
    </form>

    <p class="text-xs text-center mt-6" style="color:var(--slate-600);">
      Não tem acesso? Peça para um administrador criar sua conta no Supabase.
    </p>
  </div>

<script>
  const SUPABASE_URL = 'https://ocrpsqbpeeyeqgmpcjpw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_nqxiS4XjUe5zo82zXXjw4w_HnALfOO0';

  let supabaseClient = null;

  window.addEventListener('load', async () => {
    if (window.supabase && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('YOUR-PROJECT')) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Se já estiver logado, pula direto pro dashboard.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    } else {
      console.warn('Supabase não configurado — configure SUPABASE_URL e SUPABASE_ANON_KEY em admin/login.html.');
    }
  });

  const form = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.add('hidden');

    if (!supabaseClient) {
      loginError.textContent = 'Supabase não configurado nesta página.';
      loginError.classList.remove('hidden');
      return;
    }

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Entrando...';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      loginError.textContent = 'E-mail ou senha inválidos.';
      loginError.classList.remove('hidden');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>
